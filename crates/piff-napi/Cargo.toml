[package]
name = "piff-napi"
version = "0.1.0"
description = "Node and Bun bindings for the piff Rust engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["serde-json"] }
napi-derive = "3.0.0"
piff-core = { path = "../piff-core" }
piff-pdfium = { path = "../piff-pdfium" }
piff-semantic = { path = "../piff-semantic" }
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
