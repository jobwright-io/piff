[package]
name = "pdf-diff"
version = "0.1.0"
description = "Piff command-line PDF comparison tool"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "piff"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
pdf-diff-core = { path = "../pdf-diff-core" }
pdf-diff-semantic = { path = "../pdf-diff-semantic" }
pdf-diff-pdfium = { path = "../pdf-diff-pdfium" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
