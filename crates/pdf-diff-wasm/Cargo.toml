[package]
name = "pdf-diff-wasm"
version = "0.1.0"
description = "Browser WASM bindings for the PDFium-backed pdf-diff engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-diff-core = { path = "../pdf-diff-core" }
pdf-diff-pdfium = { path = "../pdf-diff-pdfium" }
pdf-diff-semantic = { path = "../pdf-diff-semantic" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
