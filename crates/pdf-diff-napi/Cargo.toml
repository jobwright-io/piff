[package]
name = "pdf-diff-napi"
version = "0.1.0"
description = "Node and Bun bindings for the pdf-diff Rust engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["serde-json"] }
napi-derive = "3.0.0"
pdf-diff-core = { path = "../pdf-diff-core" }
pdf-diff-pdfium = { path = "../pdf-diff-pdfium" }
pdf-diff-semantic = { path = "../pdf-diff-semantic" }
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
