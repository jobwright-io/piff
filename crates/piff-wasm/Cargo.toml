[package]
name = "piff-wasm"
version = "0.1.1"
description = "Browser WASM bindings for the PDFium-backed piff engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piff-core = { path = "../piff-core", version = "0.1.1" }
piff-pdfium = { path = "../piff-pdfium", version = "0.1.1" }
piff-semantic = { path = "../piff-semantic", version = "0.1.1" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
