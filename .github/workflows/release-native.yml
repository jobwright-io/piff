name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the staged native packages and generated core package to GitHub Packages
        required: true
        default: false
        type: boolean
      pdfium_tag:
        description: Chromium PDFium release number from bblanchon/pdfium-binaries
        required: true
        default: '7881'
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  PDFIUM_RELEASE_TAG: ${{ inputs.pdfium_tag || '7881' }}

jobs:
  wasm:
    name: Browser WASM artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build browser bindings
        run: node scripts/build-wasm.mjs --output artifacts/wasm

      - name: Upload browser bindings
        uses: actions/upload-artifact@v4
        with:
          name: browser-wasm
          path: artifacts/wasm
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            pdfium_runtime: lib/libpdfium.so
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            pdfium_runtime: lib/libpdfium.so
          - target: darwin-x64
            runner: macos-14
            rust_target: x86_64-apple-darwin
            pdfium_runtime: lib/libpdfium.dylib
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            pdfium_runtime: lib/libpdfium.dylib
          - target: win32-x64-msvc
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            pdfium_runtime: bin/pdfium.dll

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build N-API module
        shell: bash
        run: cargo build --locked --package piff-napi --release --target "${{ matrix.rust_target }}"

      - name: Download pinned PDFium
        shell: bash
        run: node scripts/download-pdfium.mjs --target "${{ matrix.target }}" --tag "$PDFIUM_RELEASE_TAG" --output "$RUNNER_TEMP/pdfium"

      - name: Copy native module to staging input
        shell: bash
        run: node scripts/copy-native-module.mjs --target-dir "target/${{ matrix.rust_target }}/release" --output "$RUNNER_TEMP/piff-napi.node"

      - name: Stage platform package
        shell: bash
        run: node scripts/stage-native-package.mjs --target "${{ matrix.target }}" --native "$RUNNER_TEMP/piff-napi.node" --pdfium "$RUNNER_TEMP/pdfium/${{ matrix.pdfium_runtime }}" --pdfium-root "$RUNNER_TEMP/pdfium" --pdfium-tag "$PDFIUM_RELEASE_TAG" --output "$RUNNER_TEMP/package"

      - name: Verify package manifest
        shell: bash
        run: node scripts/verify-native-package.mjs --package "$RUNNER_TEMP/package" --target "${{ matrix.target }}" --pdfium-tag "$PDFIUM_RELEASE_TAG"

      - name: Upload staged package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 14

  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            pdfium_runtime: lib/libpdfium.so
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            pdfium_runtime: lib/libpdfium.so
          - target: darwin-x64
            runner: macos-14
            rust_target: x86_64-apple-darwin
            pdfium_runtime: lib/libpdfium.dylib
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            pdfium_runtime: lib/libpdfium.dylib
          - target: win32-x64-msvc
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            pdfium_runtime: bin/pdfium.dll

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build CLI binary
        shell: bash
        run: cargo build --locked --package piff --release --target "${{ matrix.rust_target }}"

      - name: Download pinned PDFium
        shell: bash
        run: node scripts/download-pdfium.mjs --target "${{ matrix.target }}" --tag "$PDFIUM_RELEASE_TAG" --output "$RUNNER_TEMP/pdfium"

      - name: Stage CLI artifact
        shell: bash
        run: |
          binary="target/${{ matrix.rust_target }}/release/piff"
          if [[ "${{ matrix.target }}" == win32-* ]]; then binary="$binary.exe"; fi
          node scripts/stage-cli-package.mjs \
            --target "${{ matrix.target }}" \
            --binary "$binary" \
            --pdfium "$RUNNER_TEMP/pdfium/${{ matrix.pdfium_runtime }}" \
            --pdfium-root "$RUNNER_TEMP/pdfium" \
            --pdfium-tag "$PDFIUM_RELEASE_TAG" \
            --output "$RUNNER_TEMP/piff-cli"

      - name: Verify CLI artifact
        shell: bash
        run: node scripts/verify-cli-package.mjs --package "$RUNNER_TEMP/piff-cli" --target "${{ matrix.target }}" --pdfium-tag "$PDFIUM_RELEASE_TAG"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/piff-cli
          if-no-files-found: error
          retention-days: 14

  cli-release:
    name: Upload CLI release assets
    needs: cli
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts/cli
          merge-multiple: false

      - name: Archive CLI artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          for directory in artifacts/cli/cli-*; do
            target="${directory##*/cli-}"
            tar -czf "artifacts/release/piff-${RELEASE_TAG}-${target}.tar.gz" -C "$directory" .
          done
          sha256sum artifacts/release/*.tar.gz > artifacts/release/SHA256SUMS

      - name: Upload CLI assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish GitHub Packages
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@jobwright-io'
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Download staged packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-native-packages.mjs --root artifacts/native

      - name: Prepare core package metadata
        run: node scripts/prepare-core-package.mjs --source packages/piff --output artifacts/release/core

      - name: Publish core package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish artifacts/release/core --access public

  publish-cargo:
    name: Publish crates.io packages
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate crate packages
        run: cargo package --workspace --locked --no-verify

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for package in piff-core piff-semantic piff-pdfium piff-napi piff-wasm piff; do
            version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version')"
            if curl --fail --silent --show-error \
              --user-agent "piffjs-release/${GITHUB_SHA} (https://github.com/jobwright-io/piffjs)" \
              "https://crates.io/api/v1/crates/$package/$version" >/dev/null; then
              echo "$package@$version is already on crates.io; skipping"
            else
              cargo publish --locked --package "$package"
            fi
          done
